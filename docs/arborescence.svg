<text x="43" y="562" font-size="13" font-weight="600" fill="#1b1a18">The members-only wall</text>
<text x="43" y="581" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">The Governance tab and its two sub-tabs require:</text>
<text x="43" y="595" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">1. a wallet signature over a short-lived nonce</text>
<text x="43" y="609" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">2. a card balance checked on-chain, never cached</text>
<text x="43" y="623" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">A 30-min session then, to avoid re-signing.</text>
<text x="30" y="786" font-family="IBM Plex Mono,Menlo,monospace" font-size="10" fill="#4a4a48">One application page: the tab lives in the URL so a refresh or a shared link lands in the right place.</text>
