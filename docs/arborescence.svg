<text x="42" y="579" font-size="13" font-weight="600" fill="#1b1a18">Le mur « membres »</text>
<text x="42" y="596" font-family="IBM Plex Mono,Menlo,monospace" font-size="10" fill="#4a4a48">L'onglet Gouvernance et ses deux sous-onglets exigent :</text>
<text x="42" y="610" font-family="IBM Plex Mono,Menlo,monospace" font-size="10" fill="#4a4a48">  1. une signature du wallet sur un nonce court</text>
<text x="42" y="624" font-family="IBM Plex Mono,Menlo,monospace" font-size="10" fill="#4a4a48">  2. un solde de carte vérifié on-chain, à chaque</text>
<text x="42" y="638" font-family="IBM Plex Mono,Menlo,monospace" font-size="10" fill="#4a4a48">     première demande — jamais depuis un cache</text>
<text x="42" y="652" font-family="IBM Plex Mono,Menlo,monospace" font-size="10" fill="#4a4a48">Session de 30 min ensuite, pour éviter de re-signer.</text>
<text x="30" y="700" font-family="IBM Plex Mono,Menlo,monospace" font-size="10" fill="#4a4a48">Une seule page applicative : l'onglet vit dans l'URL pour qu'un rechargement ou un lien partagé retombe au bon endroit.</text>
