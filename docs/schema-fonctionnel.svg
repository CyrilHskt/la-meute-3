<text x="556" y="428" font-family="IBM Plex Mono,Menlo,monospace" font-size="9.5" font-weight="600" fill="#4a4a48" text-anchor="start" letter-spacing="0.08em">×N</text>
<line x1="296" y1="492" x2="296" y2="520" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<text x="304" y="512" font-family="IBM Plex Mono,Menlo,monospace" font-size="10" font-weight="500" fill="#4a4a48" text-anchor="start" letter-spacing="0.08em">après 7 jours</text>
<rect x="44" y="520" width="504" height="52" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="520" width="3" height="52" fill="#1b1a18"/>
<text x="58" y="541" font-size="13.5" font-weight="600" fill="#1b1a18">execute(proposalId)</text>
<text x="58" y="560" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">appelable par QUICONQUE, membre ou non — aucun rôle ne retient un résultat</text>
<line x1="296" y1="572" x2="296" y2="598" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="598" width="504" height="58" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="598" width="3" height="58" fill="#a34a20"/>
<text x="58" y="619" font-size="13.5" font-weight="600" fill="#1b1a18">Quorum, puis majorité</text>
<text x="58" y="638" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">votes exprimés × 4  &gt;  activeSnapshot × 3        (soit plus de 75 %)</text>
<text x="58" y="653" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">puis : oui &gt; non, strictement — l'égalité échoue</text>
<line x1="296" y1="656" x2="296" y2="686" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<text x="44" y="678" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" text-anchor="start" letter-spacing="0.08em">2 · EFFET, SELON LE TYPE</text>
