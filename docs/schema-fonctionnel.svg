<text x="667" y="316" font-size="13" font-weight="600" fill="#1b1a18">Front Vue 3</text>
<text x="667" y="335" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">reads reserved to members</text>
<text x="667" y="349" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">(signature + balance checked live)</text>
<text x="667" y="363" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">writes: wallet, not server</text>
<line x1="765" y1="379" x2="765" y2="395" stroke="#4a4a48" stroke-width="1.5" marker-end="url(#ad)"/>
<rect x="654" y="395" width="222" height="63" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="654" y="395" width="3" height="63" fill="#8a6529"/>
<text x="667" y="413" font-size="13" font-weight="600" fill="#1b1a18">Discord</text>
<text x="667" y="432" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">webhook: proposals opened</text>
<text x="667" y="446" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">OAuth2: off-chain identity</text>
