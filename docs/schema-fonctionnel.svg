<text x="58" y="262" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">proposeExclusion()</text>
<rect x="44" y="268" width="504" height="38" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="268" width="3" height="38" fill="#a34a20"/>
<text x="58" y="289" font-size="13.5" font-weight="500" fill="#1b1a18">Dépense</text>
<text x="58" y="308" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">proposeExpense(bénéficiaire, montant, motif)</text>
<line x1="296" y1="314" x2="296" y2="336" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="336" width="504" height="58" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="336" width="3" height="58" fill="#1b1a18"/>
<text x="58" y="357" font-size="13.5" font-weight="600" fill="#1b1a18">Proposition ouverte</text>
<text x="58" y="376" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">deadline = maintenant + 7 jours</text>
<text x="58" y="391" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">activeSnapshot GELÉ à l'ouverture — le dénominateur ne bougera plus</text>
<line x1="296" y1="394" x2="296" y2="418" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="418" width="504" height="74" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="418" width="3" height="74" fill="#3f7d4a"/>
<text x="58" y="439" font-size="13.5" font-weight="600" fill="#1b1a18">vote(proposalId, choix)</text>
<text x="58" y="458" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Loups actifs uniquement — un dormant sort du dénominateur</text>
<text x="58" y="473" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">réveille le votant  ·  conflit d'intérêts bloqué sur exclusion et dépense</text>
<text x="58" y="488" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Approuver / Refuser / Reporter (titularisation seulement)</text>
