<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1111" width="920" height="1111" font-family="Inter,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1a18"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4a48"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f7d4a"/></marker></defs>
<rect width="920" height="1111" fill="#f5f0ea"/>
<text x="30" y="38" font-size="21" font-weight="600" fill="#1b1a18">La Meute 3.0 — functional diagram</text>
<line x1="30" y1="52" x2="890" y2="52" stroke="#1b1a18" stroke-width="2"/>
<rect x="30" y="70" width="548" height="1001" fill="none" stroke="#c9c0b3" stroke-dasharray="4 4"/>
<rect x="640" y="70" width="250" height="404" fill="none" stroke="#c9c0b3" stroke-dasharray="4 4"/>
<text x="44" y="88" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" letter-spacing="0.08em">ON-CHAIN — contracts/Meute.sol</text>
<text x="654" y="88" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" letter-spacing="0.08em">OFF-CHAIN — DERIVED</text>
<text x="44" y="118" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" letter-spacing="0.08em">1 · OPENING — any Wolf, no convening required</text>
<rect x="44" y="130" width="504" height="49" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="130" width="3" height="49" fill="#3f7d4a"/>
<text x="57" y="148" font-size="13" font-weight="500" fill="#1b1a18">Application</text>
<text x="57" y="167" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">applyForMembership()  ·  exact fee</text>
<rect x="44" y="185" width="504" height="49" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="185" width="3" height="49" fill="#8a6529"/>
<text x="57" y="203" font-size="13" font-weight="500" fill="#1b1a18">Confirmation</text>
<text x="57" y="222" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">openConfirmationVote()  ·  90-day probation elapsed</text>
<rect x="44" y="240" width="504" height="49" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="240" width="3" height="49" fill="#b23b2e"/>
<text x="57" y="258" font-size="13" font-weight="500" fill="#1b1a18">Exclusion</text>
<text x="57" y="277" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">proposeExclusion()</text>
<rect x="44" y="295" width="504" height="49" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="295" width="3" height="49" fill="#a34a20"/>
<text x="57" y="313" font-size="13" font-weight="500" fill="#1b1a18">Expense</text>
<text x="57" y="332" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">proposeExpense(beneficiary, amount, reason)</text>
<line x1="296" y1="348" x2="296" y2="368" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="368" width="504" height="63" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="368" width="3" height="63" fill="#1b1a18"/>
<text x="57" y="386" font-size="13" font-weight="600" fill="#1b1a18">Proposal open</text>
<text x="57" y="405" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">deadline = now + 7 days</text>
<text x="57" y="419" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">activeSnapshot FROZEN at opening — the denominator will not move</text>
<line x1="296" y1="435" x2="296" y2="457" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="457" width="504" height="77" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="457" width="3" height="77" fill="#3f7d4a"/>
<text x="57" y="475" font-size="13" font-weight="600" fill="#1b1a18">vote(proposalId, choice)</text>
<text x="57" y="494" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">active Wolves only — a dormant one leaves the denominator</text>
<text x="57" y="508" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">wakes the voter  ·  conflict of interest blocked on exclusion and expense</text>
<text x="57" y="522" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Approve / Reject / Postpone (confirmation only)</text>
<path d="M548 479 q34 0 34 22 q0 22 -34 22" fill="none" stroke="#4a4a48" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ad)"/>
<text x="556" y="469" font-family="IBM Plex Mono,Menlo,monospace" font-size="9.5" font-weight="600" fill="#4a4a48">×N</text>
<line x1="296" y1="538" x2="296" y2="564" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<text x="304" y="556" font-family="IBM Plex Mono,Menlo,monospace" font-size="10" fill="#4a4a48">after 7 days</text>
<rect x="44" y="564" width="504" height="49" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="564" width="3" height="49" fill="#1b1a18"/>
<text x="57" y="582" font-size="13" font-weight="600" fill="#1b1a18">execute(proposalId)</text>
<text x="57" y="601" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">callable by ANYONE, member or not — no role can hold a result hostage</text>
<line x1="296" y1="617" x2="296" y2="639" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="639" width="504" height="63" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="639" width="3" height="63" fill="#a34a20"/>
<text x="57" y="657" font-size="13" font-weight="600" fill="#1b1a18">Quorum, then majority</text>
<text x="57" y="676" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">votes cast × 4  &gt;  activeSnapshot × 3        (i.e. more than 75%)</text>
<text x="57" y="690" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">then: yes &gt; no, strictly — a tie fails</text>
<line x1="296" y1="706" x2="296" y2="736" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<text x="44" y="726" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" letter-spacing="0.08em">2 · EFFECT, BY TYPE</text>
<rect x="44" y="736" width="504" height="49" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="736" width="3" height="49" fill="#3f7d4a"/>
<text x="57" y="754" font-size="13" font-weight="500" fill="#1b1a18">Admission</text>
<text x="57" y="773" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Cub card minted, or fee refunded</text>
<rect x="44" y="791" width="504" height="49" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="791" width="3" height="49" fill="#8a6529"/>
<text x="57" y="809" font-size="13" font-weight="500" fill="#1b1a18">Confirmation</text>
<text x="57" y="828" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">promoted to Wolf, or postponed (2 max), or card burned</text>
<rect x="44" y="846" width="504" height="49" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="846" width="3" height="49" fill="#b23b2e"/>
<text x="57" y="864" font-size="13" font-weight="500" fill="#1b1a18">Exclusion</text>
<text x="57" y="883" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">card burned</text>
<rect x="44" y="901" width="504" height="49" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="44" y="901" width="3" height="49" fill="#a34a20"/>
<text x="57" y="919" font-size="13" font-weight="500" fill="#1b1a18">Expense</text>
<text x="57" y="938" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">ETH transferred to the beneficiary</text>
<line x1="296" y1="954" x2="296" y2="978" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="978" width="504" height="77" fill="#f5f0ea" stroke="#c9c0b3"/>
<rect x="44" y="978" width="3" height="77" fill="#1b1a18"/>
<text x="57" y="996" font-size="13" font-weight="600" fill="#1b1a18">Events emitted</text>
<text x="57" y="1015" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">ProposalOpened · VoteCast · ProposalExecuted</text>
<text x="57" y="1029" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Transfer (mint / burn) · DonationReceived · MemberWokenUp</text>
<text x="57" y="1043" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">a proposal's author exists ONLY in the event</text>
<rect x="654" y="118" width="222" height="77" fill="#eae3d8" stroke="#c9c0b3"/>
<rect x="654" y="118" width="3" height="77" fill="#a34a20"/>
<text x="667" y="136" font-size="13" font-weight="600" fill="#1b1a18">Indexer</text>
<text x="667" y="155" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">scripts/sync-dao.js</text>
<text x="667" y="169" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">GitHub Actions cron, 30 min</text>
<text x="667" y="183" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">walks the new blocks</text>
