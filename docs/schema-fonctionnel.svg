<text x="667" y="252" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Netlify Blobs</text>
<text x="667" y="266" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">stats · proposals · members</text>
<line x1="765" y1="282" x2="765" y2="298" stroke="#4a4a48" stroke-width="1.5" marker-end="url(#ad)"/>
