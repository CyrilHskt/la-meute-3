<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1015" width="920" height="1015" font-family="Inter,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1a18"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3f7d4a"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a4a48"/></marker></defs>
<rect width="920" height="1015" fill="#f5f0ea"/>
<text x="30" y="38" font-size="21" font-weight="600" fill="#1b1a18">La Meute 3.0 — functional diagram</text>
<line x1="30" y1="52" x2="890" y2="52" stroke="#1b1a18" stroke-width="2"/>
<rect x="30" y="70" width="548" height="905" fill="none" stroke="#c9c0b3" stroke-dasharray="4 4"/>
<rect x="640" y="70" width="250" height="424" fill="none" stroke="#c9c0b3" stroke-dasharray="4 4"/>
<text x="44" y="88" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" text-anchor="start" letter-spacing="0.08em">ON-CHAIN — contracts/Meute.sol</text>
<text x="654" y="88" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" text-anchor="start" letter-spacing="0.08em">OFF-CHAIN — DERIVED</text>
<text x="44" y="118" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" text-anchor="start" letter-spacing="0.08em">1 · OPENING — any Wolf, no convening required</text>
<rect x="44" y="130" width="504" height="38" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="130" width="3" height="38" fill="#3f7d4a"/>
<text x="58" y="151" font-size="13.5" font-weight="500" fill="#1b1a18">Application</text>
<text x="58" y="170" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">applyForMembership()  ·  exact fee</text>
<rect x="44" y="176" width="504" height="38" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="176" width="3" height="38" fill="#8a6529"/>
<text x="58" y="197" font-size="13.5" font-weight="500" fill="#1b1a18">Confirmation</text>
<text x="58" y="216" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">openConfirmationVote()  ·  90-day probation elapsed</text>
<rect x="44" y="222" width="504" height="38" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="222" width="3" height="38" fill="#b23b2e"/>
<text x="58" y="243" font-size="13.5" font-weight="500" fill="#1b1a18">Exclusion</text>
<text x="58" y="262" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">proposeExclusion()</text>
<rect x="44" y="268" width="504" height="38" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="268" width="3" height="38" fill="#a34a20"/>
<text x="58" y="289" font-size="13.5" font-weight="500" fill="#1b1a18">Expense</text>
<text x="58" y="308" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">proposeExpense(beneficiary, amount, reason)</text>
<line x1="296" y1="314" x2="296" y2="336" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="336" width="504" height="58" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="336" width="3" height="58" fill="#1b1a18"/>
<text x="58" y="357" font-size="13.5" font-weight="600" fill="#1b1a18">Proposal open</text>
<text x="58" y="376" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">deadline = now + 7 days</text>
<text x="58" y="391" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">activeSnapshot FROZEN at opening — the denominator will not move</text>
<line x1="296" y1="394" x2="296" y2="418" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="418" width="504" height="74" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="418" width="3" height="74" fill="#3f7d4a"/>
<text x="58" y="439" font-size="13.5" font-weight="600" fill="#1b1a18">vote(proposalId, choice)</text>
<text x="58" y="458" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">active Wolves only — a dormant one leaves the denominator</text>
<text x="58" y="473" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">wakes the voter  ·  conflict of interest blocked on exclusion and expense</text>
<text x="58" y="488" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Approve / Reject / Postpone (confirmation only)</text>
<path d="M548 440 q34 0 34 22 q0 22 -34 22" fill="none" stroke="#4a4a48" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ad)"/>
<text x="556" y="428" font-family="IBM Plex Mono,Menlo,monospace" font-size="9.5" font-weight="600" fill="#4a4a48" text-anchor="start" letter-spacing="0.08em">×N</text>
<line x1="296" y1="492" x2="296" y2="520" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<text x="304" y="512" font-family="IBM Plex Mono,Menlo,monospace" font-size="10" font-weight="500" fill="#4a4a48" text-anchor="start" letter-spacing="0.08em">after 7 days</text>
<rect x="44" y="520" width="504" height="52" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="520" width="3" height="52" fill="#1b1a18"/>
<text x="58" y="541" font-size="13.5" font-weight="600" fill="#1b1a18">execute(proposalId)</text>
<text x="58" y="560" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">callable by ANYONE, member or not — no role can hold a result hostage</text>
<line x1="296" y1="572" x2="296" y2="598" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="598" width="504" height="58" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="598" width="3" height="58" fill="#a34a20"/>
<text x="58" y="619" font-size="13.5" font-weight="600" fill="#1b1a18">Quorum, then majority</text>
<text x="58" y="638" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">votes cast × 4  &gt;  activeSnapshot × 3        (i.e. more than 75%)</text>
<text x="58" y="653" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">then: yes &gt; no, strictly — a tie fails</text>
<line x1="296" y1="656" x2="296" y2="686" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<text x="44" y="678" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" text-anchor="start" letter-spacing="0.08em">2 · EFFECT, BY TYPE</text>
<rect x="44" y="690" width="504" height="34" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="690" width="3" height="34" fill="#3f7d4a"/>
<text x="58" y="711" font-size="13.5" font-weight="500" fill="#1b1a18">Admission</text>
<text x="58" y="730" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Cub card minted, or fee refunded</text>
<rect x="44" y="732" width="504" height="34" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="732" width="3" height="34" fill="#8a6529"/>
<text x="58" y="753" font-size="13.5" font-weight="500" fill="#1b1a18">Confirmation</text>
<text x="58" y="772" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Wolf, or postponed (2 max), or card burned</text>
<rect x="44" y="774" width="504" height="34" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="774" width="3" height="34" fill="#b23b2e"/>
<text x="58" y="795" font-size="13.5" font-weight="500" fill="#1b1a18">Exclusion</text>
<text x="58" y="814" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">card burned</text>
<rect x="44" y="816" width="504" height="34" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="816" width="3" height="34" fill="#a34a20"/>
<text x="58" y="837" font-size="13.5" font-weight="500" fill="#1b1a18">Expense</text>
<text x="58" y="856" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">ETH transferred to the beneficiary</text>
<line x1="296" y1="858" x2="296" y2="884" stroke="#1b1a18" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="884" width="504" height="66" fill="#f5f0ea" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="884" width="3" height="66" fill="#1b1a18"/>
<text x="58" y="905" font-size="13.5" font-weight="600" fill="#1b1a18">Events emitted</text>
<text x="58" y="924" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">ProposalOpened · VoteCast · ProposalExecuted</text>
<text x="58" y="939" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Transfer (mint/burn) · DonationReceived · MemberWokenUp</text>
<text x="58" y="954" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">a proposal's author exists ONLY in the event</text>
<rect x="654" y="118" width="222" height="74" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="654" y="118" width="3" height="74" fill="#a34a20"/>
<text x="668" y="139" font-size="13.5" font-weight="600" fill="#1b1a18">Indexer</text>
<text x="668" y="158" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">scripts/sync-dao.js</text>
<text x="668" y="173" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">GitHub Actions cron, 30 min</text>
<text x="668" y="188" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">walks the new blocks</text>
<rect x="654" y="210" width="222" height="58" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="654" y="210" width="3" height="58" fill="#a34a20"/>
