<text x="58" y="905" font-size="13.5" font-weight="600" fill="#1b1a18">Événements émis</text>
<text x="58" y="924" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">ProposalOpened · VoteCast · ProposalExecuted</text>
<text x="58" y="939" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Transfer (frappe/destruction) · DonationReceived · MemberWokenUp</text>
