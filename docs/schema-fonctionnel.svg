<text x="30" y="999" font-size="10.5" fill="#4a4a48" font-family="IBM Plex Mono,Menlo,monospace">La vérité de gouvernance est sur la chaîne. Tout ce qui est hors chaîne en est dérivé, jamais la source.</text>
