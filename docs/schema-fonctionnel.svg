<rect width="920" height="1015" fill="#f5f0ea"/>
<text x="30" y="38" font-size="21" font-weight="600" fill="#1b1a18">La Meute 3.0 — schéma fonctionnel</text>
<line x1="30" y1="52" x2="890" y2="52" stroke="#1b1a18" stroke-width="2"/>
<rect x="30" y="70" width="548" height="905" fill="none" stroke="#c9c0b3" stroke-dasharray="4 4"/>
<rect x="640" y="70" width="250" height="424" fill="none" stroke="#c9c0b3" stroke-dasharray="4 4"/>
<text x="44" y="88" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" text-anchor="start" letter-spacing="0.08em">SUR LA CHAÎNE — contracts/Meute.sol</text>
<text x="654" y="88" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" text-anchor="start" letter-spacing="0.08em">HORS CHAÎNE — DÉRIVÉ</text>
<text x="44" y="118" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" font-weight="600" fill="#a34a20" text-anchor="start" letter-spacing="0.08em">1 · OUVERTURE — n'importe quel Loup, sans convocation</text>
<rect x="44" y="130" width="504" height="38" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="130" width="3" height="38" fill="#3f7d4a"/>
<text x="58" y="151" font-size="13.5" font-weight="500" fill="#1b1a18">Candidature</text>
<text x="58" y="170" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">applyForMembership()  ·  cotisation exacte</text>
<rect x="44" y="176" width="504" height="38" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="176" width="3" height="38" fill="#8a6529"/>
<text x="58" y="197" font-size="13.5" font-weight="500" fill="#1b1a18">Titularisation</text>
<text x="58" y="216" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">openConfirmationVote()  ·  probation 90 j écoulée</text>
<rect x="44" y="222" width="504" height="38" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="44" y="222" width="3" height="38" fill="#b23b2e"/>
