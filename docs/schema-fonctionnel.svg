<text x="668" y="250" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">Netlify Blobs</text>
<text x="668" y="265" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">stats · proposals · members</text>
<rect x="654" y="286" width="222" height="74" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="654" y="286" width="3" height="74" fill="#3f7d4a"/>
<text x="668" y="307" font-size="13.5" font-weight="600" fill="#1b1a18">Front Vue 3</text>
<text x="668" y="326" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">reads reserved to members</text>
<text x="668" y="341" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">(signature + balance checked live)</text>
<text x="668" y="356" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">writes: wallet, not server</text>
<rect x="654" y="378" width="222" height="58" fill="#eae3d8" stroke="#c9c0b3" stroke-width="1"/>
<rect x="654" y="378" width="3" height="58" fill="#8a6529"/>
<text x="668" y="399" font-size="13.5" font-weight="600" fill="#1b1a18">Discord</text>
<text x="668" y="418" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">webhook: proposals opened</text>
<text x="668" y="433" font-family="IBM Plex Mono,Menlo,monospace" font-size="10.5" fill="#4a4a48">OAuth2: off-chain identity</text>
