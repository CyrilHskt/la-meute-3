name: Sync DAO

on:
  schedule:
    # Every 5 minutes (the minimum GitHub Actions allows) — acts as a
    # safety net: most actions are already reflected immediately via
    # ?key=patch-proposal (netlify/functions/dao-sync.mts), this cron just
    # catches up on the rest (global stats, cases where the immediate
    # patch failed). The actual frequency can vary a bit depending on
    # GitHub's load, but the persisted state (last processed block)
    # guarantees no event is ever missed or processed twice.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # Generous for the very first run: Alchemy's free plan caps
    # eth_getLogs at 10 blocks/request and at a fairly low compute-units-
    # per-second throughput (see scripts/sync-dao.js — fixed delay +
    # backoff retries on 429s), so the full catch-up since deployment
    # means hundreds of sequential, spaced-out requests. Subsequent runs
    # only process ~75 blocks (the cron interval) and finish in seconds —
    # the cumulative state (Netlify Blobs, via
    # netlify/functions/dao-sync.mts) avoids rescanning everything each
    # time.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx hardhat compile

      # No commit step afterward: the state and snapshot are written
      # directly to Netlify Blobs by the script itself (HTTP), not to the
      # repo — publishing fresh data must never trigger a site rebuild.
      - run: node scripts/sync-dao.js
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SYNC_ENDPOINT: ${{ secrets.SYNC_ENDPOINT }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
