name: Sync DAO

on:
  schedule:
    # Every 30 minutes — acts as a safety net: most actions are already
    # reflected immediately via ?key=patch-proposal
    # (netlify/functions/dao-sync.mts), this cron just catches up on the
    # rest (global stats, cases where the immediate patch failed). The
    # actual frequency can vary a bit depending on GitHub's load, but the
    # persisted state (last processed block) guarantees no event is ever
    # missed or processed twice.
    # Was every 5 minutes (288 runs/day): each run unconditionally
    # re-reads every member's card and every proposal (see
    # scripts/sync-dao.js), so the full-refresh cost scales with both run
    # count AND pack size — that combination burned through Alchemy's
    # free-tier monthly compute units well before month's end. 30 minutes
    # (48 runs/day) plus batching those reads into one multicall keeps
    # this sustainable.
    - cron: "*/30 * * * *"
  workflow_dispatch:

# false, not true: the job performs non-idempotent side effects (Discord
# posts, two sequential non-atomic Netlify Blobs writes) — cancelling a
# run mid-flight risks a corrupt/partial state, so an overlapping run
# queues behind it instead of killing it.
concurrency:
  group: sync-dao
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Generous for the very first run: Alchemy's free plan caps
    # eth_getLogs at 10 blocks/request and at a fairly low compute-units-
    # per-second throughput (see scripts/sync-dao.js — fixed delay +
    # backoff retries on 429s), so the full catch-up since deployment
    # means hundreds of sequential, spaced-out requests. Subsequent runs
    # only process ~75 blocks (the cron interval) and finish in seconds —
    # the cumulative state (Netlify Blobs, via
    # netlify/functions/dao-sync.mts) avoids rescanning everything each
    # time.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx hardhat compile

      # No commit step afterward: the state and snapshot are written
      # directly to Netlify Blobs by the script itself (HTTP), not to the
      # repo — publishing fresh data must never trigger a site rebuild.
      # CHAIN_ID + BASE_SEPOLIA_RPC_URL: L2 migration (Base) — see
      # docs/local/l2-migration-reflection.md. 84532 is Base Sepolia's
      # chain id, matching the entry in front/src/contract.ts's
      # DEPLOYMENTS. Rolling back to Sepolia is a one-line revert here
      # (CHAIN_ID: "11155111", RPC_URL: secrets.SEPOLIA_RPC_URL), no code
      # change needed.
      - run: node scripts/sync-dao.js
        env:
          CHAIN_ID: "84532"
          RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SYNC_ENDPOINT: ${{ secrets.SYNC_ENDPOINT }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
